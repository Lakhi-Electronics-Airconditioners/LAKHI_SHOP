    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        // Import doc function in addition to collection and getDocs
        import { getFirestore, collection, getDocs, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        
        // Use the global variables provided by the environment, falling back to local config if undefined
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
            authDomain: "lakhi-airconditioners.firebaseapp.com",
            projectId: "lakhi-airconditioners",
            storageBucket: "lakhi-airconditioners.firebasestorage.app",
            messagingSenderId: "284430318185",
            appId: "1:284430318185:web:ad09598be7a16ab46a00f8",
            measurementId: "G-LB63B1FRYC"
        };
        const FIRESTORE_APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'lakhi-airconditioners';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Function to fetch and display form links
        async function fetchForms() {
            const formsList = document.getElementById('forms-list');
            const titleElement = document.getElementById('forms-collection-title');
            formsList.innerHTML = '<li>Loading forms...</li>';
            titleElement.textContent = `Forms`;

            try {
                // The structure based on your screenshot is a subcollection:
                // artifacts/{appId}/data/public/Forms/{documents}
                const docId = "public"; // The document that holds the 'Forms' subcollection
                
                // 1. Point to the specific document that holds the 'Forms' sub-collection
                // Path: artifacts/lakhi-airconditioners/data/public
                const parentDocRef = doc(db, "artifacts", FIRESTORE_APP_ID, "data", docId);
                
                // 2. Point to the 'Forms' sub-collection within that document
                // Path: artifacts/lakhi-airconditioners/data/public/Forms
                const formsCollectionRef = collection(parentDocRef, "Forms");
                
                console.log('Fetching Forms collection at path:', formsCollectionRef.path);
                
                const querySnapshot = await getDocs(formsCollectionRef);
                
                formsList.innerHTML = ''; // Clear previous list

                if (querySnapshot.empty) {
                    console.log("No forms found");
                    formsList.innerHTML = '<li>No forms found</li>';
                } else {
                    const forms = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        // CRITICAL FIX: Use capitalized 'Title' and 'URL' as seen in your Firestore document
                        if (data.Title && data.URL) { 
                            forms.push(data);
                        }
                    });

                    // Render forms
                    forms.forEach((formData) => {
                        const listItem = document.createElement('li');
                        const link = document.createElement('a');
                        
                        // Use the correct capitalized keys
                        link.href = formData.URL; 
                        link.textContent = formData.Title;
                        
                        // Keeping link color as per the original structure
                        link.style.color = '#FF523b'; 
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        listItem.appendChild(link);
                        formsList.appendChild(listItem);
                    });
                }
            } catch (error) {
                console.error("Error getting documents:", error);
                formsList.innerHTML = '<li>Error loading forms. Please check the console for details.</li>';
            }
        }
        
        // Execute the function
        fetchForms();
    </script>
