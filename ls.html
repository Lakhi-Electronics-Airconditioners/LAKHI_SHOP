<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakhi Airconditioners | Account Access</title>
    <meta name="description" content="signin/signup">
    <link rel="icon" href="img/1x1-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.min.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch(err => console.error('❌ Service Worker error:', err));
        }
    </script>
</head>
<body>
    <div id="tacpp-el"></div>
    <script src="/js/rw/tacpp.js" defer></script>
    <script src="/js/TACPP.js" defer></script>

    <div class="header-NAV" id="header"></div>
    <script src="/js/rw/header.js" defer></script>

    <div class="color-NAV"><br><br><a href="#" class="back-button" onclick="history.back(); return false;">&larr; Back</a></div>

    <div class="account-container">
        <h1 class="title">Access Your Account</h1>
        <div class="ls-options">
            <p>Already have an account?</p>
            <a href="ls/signin" class="btn">Sign In</a>
            <p style="margin-top: 20px;">Don't have an account yet?</p>
            <a href="ls/signup" class="btn">Sign Up</a>
        </div>
    </div>

    <div id="footer" class="footer"></div>
    <script src="/js/rw/footer.js" defer></script>
    
    <script>
        // Menu toggle function from the template
        var Menuitems = document.getElementById('Menuitems');
        if (Menuitems) {
            Menuitems.style.maxHeight = "0px";
        }
    </script>
</body>
</html>
