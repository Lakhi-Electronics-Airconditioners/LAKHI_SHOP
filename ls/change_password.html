<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="CChange Your password using me">
    <title>Lakhi Airconditioners | Change Password</title>
    <link rel="icon" href="../img/1x1-logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="../DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.min.css">
    <script src="../data.js"></script>
    <style>
        .change-password-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            text-align: center;
        }

        .change-password-container h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-container {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-container label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .input-container input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: #ff523b;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #563434;
        }

        .message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-size: 1em;
            display: none; /* Hidden by default */
            text-align: center;
        }

        .message-box.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message-box.loading {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-NAV" id="header"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/header.js" defer></script>
    <!-- End Header -->
     <div class="color-NAV">
        <br><br>
        <a href="#" class="back-button" onclick="history.back(); return false;">&larr; Back</a>
    </div>

    <div class="change-password-container">
        <h1>Change Your Password</h1>
        <form id="changePasswordForm">
            <div class="input-container">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" >
            </div>
            <div class="input-container">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="input-container">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required>
            </div>
            <button type="submit" class="btn">Update Password</button>
        </form>
        <div id="messageBox" class="message-box"></div>
    </div>

    <!-- Footer -->
    <div id="footer" class="footer"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/footer.js" defer></script>
    <!-- End Footer -->

<script type="module">
    // Firebase SDK imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // IMPORTANT: Replace with your actual Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
        authDomain: "lakhi-airconditioners.firebaseapp.com",
        projectId: "lakhi-airconditioners",
        storageBucket: "lakhi-airconditioners.firebasestorage.app",
        messagingSenderId: "284430318185",
        appId: "1:284430318185:web:ad09598be7a16ab46a00f8",
        measurementId: "G-LB63B1FRYC"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get DOM elements
    const changePasswordForm = document.getElementById('changePasswordForm');
    const currentPasswordInput = document.getElementById('currentPassword');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
    const messageBox = document.getElementById('messageBox');

    // Function to show messages
    function showMessage(type, message) {
        messageBox.textContent = message;
        messageBox.className = `message-box ${type}`;
        messageBox.style.display = 'block';
    }

    // Check auth state on page load
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            // If user is not logged in, redirect to login page
            showMessage('error', 'You must be logged in to change your password. Redirecting to login page...');
            setTimeout(() => {
                window.location.href = '../ls';
            }, 3000);
        }
    });

    changePasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) {
            showMessage('error', 'You are not logged in. Please log in to change your password.');
            return;
        }

        const currentPassword = currentPasswordInput.value;
        const newPassword = newPasswordInput.value;
        const confirmNewPassword = confirmNewPasswordInput.value;

        if (newPassword !== confirmNewPassword) {
            showMessage('error', 'New passwords do not match!');
            return;
        }

        if (newPassword.length < 6) {
            showMessage('error', 'New password must be at least 6 characters long.');
            return;
        }

        showMessage('loading', 'Updating password...');

        try {
            // Re-authenticate the user with their current password
            const credential = EmailAuthProvider.credential(user.email, currentPassword);
            await reauthenticateWithCredential(user, credential);

            // Update the password
            await updatePassword(user, newPassword);
            showMessage('success', 'Password updated successfully! You will be redirected to your account page.');

            // Clear input fields and redirect
            currentPasswordInput.value = '';
            newPasswordInput.value = '';
            confirmNewPasswordInput.value = '';

            setTimeout(() => {
                window.location.href = '../account';
            }, 3000);

        } catch (error) {
            console.error("Error changing password:", error);
            let errorMessage = "Failed to update password. Please check your current password and try again.";
            if (error.code === 'auth/wrong-password') {
                errorMessage = "Incorrect current password. Please try again.";
            } else if (error.code === 'auth/requires-recent-login') {
                 errorMessage = "Please log out and log in again to update your password.";
            }
            showMessage('error', errorMessage);
        }
    });
</script>
</body>
</html>
