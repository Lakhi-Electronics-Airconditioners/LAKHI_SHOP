    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { 
    getAuth, 
    onAuthStateChanged, 
    updateProfile 
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { 
    getStorage, 
    ref, 
    uploadBytes, 
    getDownloadURL 
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
import { 
    getFirestore, 
    doc, 
    updateDoc 
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


// IMPORTANT: Replace with your actual Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
    authDomain: "lakhi-airconditioners.firebaseapp.com",
    projectId: "lakhi-airconditioners",
    storageBucket: "lakhi-airconditioners.appspot.com", // Ensure this is correct for Storage
    messagingSenderId: "284430318185",
    appId: "1:284430318185:web:ad09598be7a16ab46a00f8", 
    measurementId: "G-LB63B1FRYC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getFirestore(app);

let currentUser = null;
const appIdFromConfig = firebaseConfig.projectId; 


onAuthStateChanged(auth, (user) => {
    if (user) {
        currentUser = user;
        // Display current photo immediately
        const currentPic = document.getElementById('currentProfilePic');
        if (currentPic) {
             currentPic.src = user.photoURL || '../img/default-profile.png';
        }
    } else {
        // Redirect if not logged in
        window.location.href = 'https://shop.lakhiairconditioners.com/ls';
    }
});

/**
 * Handles the file upload to Storage and profile URL update.
 */
async function uploadProfilePicture() {
    if (!currentUser) {
        alert("Authentication failed. Please log in again.");
        return;
    }

    const fileInput = document.getElementById('fileInput');
    const statusMessage = document.getElementById('statusMessage');
    const file = fileInput.files[0];

    if (!file) {
        statusMessage.textContent = "Please select a file first.";
        return;
    }
    
    statusMessage.textContent = "Uploading image... Please wait.";

    try {
        // 1. Upload to Firebase Storage (using UID as folder and file timestamp for unique name)
        const fileName = `${Date.now()}_${file.name}`;
        const storageRef = ref(storage, `user_profiles/${currentUser.uid}/profile_pic/${fileName}`);
        
        const uploadTask = await uploadBytes(storageRef, file);
        const photoURL = await getDownloadURL(uploadTask.ref);

        console.log("Image uploaded successfully. URL:", photoURL);
        
        // 2. Update Firebase Authentication profile
        await updateProfile(currentUser, {
            photoURL: photoURL
        });

        // 3. Update Firestore profile document (for persistent record)
        const userProfileRef = doc(db, "artifacts", appIdFromConfig, "users", currentUser.uid, "user_profiles", "profile");
        await updateDoc(userProfileRef, {
            photoURL: photoURL
        }, { merge: true });

        statusMessage.textContent = "Profile picture updated successfully! Redirecting to account page in 3 seconds.";
        
        // Redirect back to account page after successful upload
        setTimeout(() => {
            window.location.href = '../account';
        }, 3000);

    } catch (error) {
        console.error("Error uploading profile picture:", error);
        statusMessage.textContent = `Error uploading picture: ${error.message}`;
        alert(`Error uploading profile picture: ${error.message}`);
    }
}

// Make the function globally accessible from the HTML button
window.uploadProfilePicture = uploadProfilePicture;

// Optional: Automatically trigger upload when a file is selected (removes the need for a second button click)
document.addEventListener('DOMContentLoaded', () => {
    const fileInput = document.getElementById('fileInput');
    if (fileInput) {

             // You can uncomment the line below if you want the upload to happen immediately after selection
             // uploadProfilePicture();

        });
    }
});
