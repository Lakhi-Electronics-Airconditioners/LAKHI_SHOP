<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakhi Airconditioners | Forgot Password</title>
    <meta name="description" content="Forgot your password??? then reset it using me">
    <link rel="icon" href="../img/1x1-logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="../DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.min.css">
    <script src="../data.js"></script>
    <style>
        .forgot-password-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            text-align: center;
        }

        .forgot-password-container h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .forgot-password-container p {
            color: #666;
            margin-bottom: 25px;
        }

        .input-container {
            margin-bottom: 20px;
        }

        .input-container input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: #ff523b;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #563434;
        }

        .message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-size: 1em;
            display: none; /* Hidden by default */
        }

        .message-box.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message-box.loading {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-NAV" id="header"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/header.js" defer></script>
    <!-- End Header -->
     <div class="color-NAV">
        <br><br>
        <a href="#" class="back-button" onclick="history.back(); return false;">&larr; Back</a>
    </div>

    <div class="forgot-password-container">
        <h1>Forgot Your Password?</h1>
        <p>Enter the email address associated with your account and we'll send you a link to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="input-container">
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
        </form>
        <div id="messageBox" class="message-box"></div>
    </div>

    <!-- Footer -->
   <div id="footer" class="footer"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/footer.js" defer></script>
    <!-- End Footer -->

<script type="module">
    // Firebase SDK imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // IMPORTANT: Replace with your actual Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
        authDomain: "lakhi-airconditioners.firebaseapp.com",
        projectId: "lakhi-airconditioners",
        storageBucket: "lakhi-airconditioners.firebasestorage.app",
        messagingSenderId: "284430318185",
        appId: "1:284430318185:web:ad09598be7a16ab46a00f8",
        measurementId: "G-LB63B1FRYC"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get DOM elements
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const messageBox = document.getElementById('messageBox');

    // Function to show messages
    function showMessage(type, message) {
        messageBox.textContent = message;
        messageBox.className = `message-box ${type}`;
        messageBox.style.display = 'block';
    }

    forgotPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (email) {
            showMessage('loading', 'Sending password reset link...');
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('success', 'A password reset link has been sent to your email. Please check your inbox.');
                // Clear the input field after successful submission
                emailInput.value = '';
            } catch (error) {
                console.error("Error sending password reset email:", error);
                let errorMessage = "Failed to send reset email. Please try again.";
                if (error.code === 'auth/invalid-email') {
                    errorMessage = "The email address is not valid.";
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage = "No user found with that email address.";
                }
                showMessage('error', errorMessage);
            }
        } else {
            showMessage('error', 'Please enter your email address.');
        }
    });
</script>
</body>
</html>
