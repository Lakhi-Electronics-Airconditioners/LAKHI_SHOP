<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakhi Airconditioners | ALL products</title>
    <meta name="description" content="See All the products in on are website (only goods)">
    <link rel="icon" href="img/1x1-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.min.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch(err => console.error('❌ Service Worker error:', err));
        }

</head>
<body>
    <div id="tacpp-el"></div>
    <script src="/js/rw/tacpp.js" defer></script>
    <script src="/js/TACPP.js" defer></script>

    <div class="header-NAV" id="header"></div>
    <script src="/js/rw/header.js" defer></script>

    <div class="color-NAV"><br><br><a href="#" class="back-button" onclick="history.back(); return false;">&larr; Back</a></div>

        <div class="row row-2">
            <h2>All Products</h2>
            <hr width="100%" style="margin-top: 10px; margin-bottom: 10px; border: 0px solid #ccc;text-align: center;">
            <div class="col-2" style="text-align: center;">
            <!-- Sorting Dropdown -->
                <select id="sortSelect">
                    <option value="default">Default Sorting</option>
                    <option value="price-asc">Sort by Price (Low to High)</option>
                    <option value="price-desc">Sort by Price (High to Low)</option>
                    <option value="name-asc">Sort by Name (A-Z)</option>
                    <option value="name-desc">Sort by Name (Z-A)</option>
                </select>
            </div>
            <div class="col-2" style="text-align: center;">
            <!-- Search Bar -->
                <div class="search-bar search-container" style="margin-bottom: 20px; text-align: center;">
                    <input type="text" id="productSearchInput" placeholder="Search by Name or S/R Number..." style="padding: 8px; width: 250px; border-radius: 4px; border: 1px solid #ccc;">
                    <button id="productSearchBtn" style="padding: 8px 12px; border-radius: 4px; border: none; background: #d12711; color: #ffffff; cursor: pointer;">
                        <i class="fa fa-search"></i> Search
                    </button>
            </div>
            </div>
        </div>
        </div>

        <div id="productSection" class="container">
            <div id="productContainer" class="row">
            </div>
            <p id="totalProducts" style="text-align: center; width: 100%; margin-top: 20px;"></p>
        </div>

    <div id="footer" class="footer"></div>
    <script src="/js/rw/footer.js" defer></script>

    <script>
        // New function for handling image loading errors with fallbacks
        function handleImageError(imgElement, serialNo) {
            // Check if we've already tried the serial number fallback
            if (!imgElement.dataset.serialFallbackAttempted) {
                imgElement.dataset.serialFallbackAttempted = 'true'; // Mark as attempted
                imgElement.src = `img/PROC/${serialNo}.jpg`; // Try serial number image
                console.log(`Image failed for ${serialNo}. Trying fallback: img/PROC/${serialNo}.jpg`);
            } else {
                // If serial number fallback was already attempted and failed, use final default
                imgElement.onerror = null; // Prevent infinite loop for DP.png if it somehow fails
                imgElement.src = 'img/PROC/DP.gif';
                console.log(`Serial number fallback failed for ${serialNo}. Using final fallback: img/PROC/DP.gif`);
            }
        }
    </script>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
        authDomain: "lakhi-airconditioners.firebaseapp.com",
        projectId: "lakhi-airconditioners",
        storageBucket: "lakhi-airconditioners.firebasestorage.app",
        messagingSenderId: "284430318185",
        appId: "1:284430318185:web:ad09598be7a16ab46a00f8",
        measurementId: "G-LB63B1FRYC"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Ensure this APP_ID matches the projectId in your firebaseConfig and your Python backend's APP_ID
    const FIRESTORE_APP_ID = "lakhi-airconditioners"; // This must match your Firebase project ID and APP_ID in Python scripts

    // --- Cart Functions ---
    function addToCart(serialNo, quantity, selectedSize, productUnit, productName, productPrice) {
        console.log('addToCart function entered.'); // Debugging log
        // *** CHANGED FROM 'cart' TO 'cartitems' ***
        let cart = JSON.parse(localStorage.getItem('cartitems')) || []; 

        const existingItemIndex = cart.findIndex(item => item.serial_no === serialNo);

        if (existingItemIndex > -1) {
            cart[existingItemIndex].qty += quantity;
        } else {
            cart.push({
                serial_no: serialNo,
                quantity: quantity,
                size: selectedSize,
                unit: productUnit,
                name: productName,
                price: productPrice
            });
        }

        // *** CHANGED FROM 'cart' TO 'cartitems' ***
        localStorage.setItem('cartitems', JSON.stringify(cart)); 
        alert(`${productName} added to cart! Quantity: ${quantity}`);
        console.log('Current cartitems:', JSON.parse(localStorage.getItem('cartitems'))); // Debugging log
        // You might want to update a cart count display here
    }
    // --- End Cart Functions ---


    const productContainer = document.getElementById('productContainer');
    const sortSelect = document.getElementById('sortSelect');
    let allProducts = []; // To store all products fetched from Firestore

     function generateStars(rating) {
            let starsHTML = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);

            for (let i = 0; i < fullStars; i++) {
                starsHTML += '<i class="fa-solid fa-star"></i>';
            }
            if (hasHalfStar) {
                starsHTML += '<i class="fa-solid fa-star-half-stroke"></i>';
            }
            for (let i = 0; i < emptyStars; i++) {
                starsHTML += '<i class="fa-regular fa-star"></i>';
            }
            return starsHTML;
        }


    // Function to render products
    function renderProducts(productsToRender) {
        productContainer.innerHTML = ''; // Clear previous products

        if (productsToRender.length === 0) {
            productContainer.innerHTML = '<p style="text-align: center; width: 100%; margin-top: 20px;">No products found.</p>';
            return;
        }

        productsToRender.forEach(product => {
            const productCard = document.createElement('div');
            productCard.classList.add('col-4');
            productCard.innerHTML = `
                <a href="product_detail?serial_no=${product.serial_no}">
                    <img src="${product.image_url}"
                         alt="${product.name}"
                         onerror="handleImageError(this, '${product.serial_no}');">
                </a>
                <a href="product_detail?serial_no=${product.serial_no}"><h4>${product.name}</h4></a>
               <div class="rating">
                        ${generateStars(product['rating'] || 0)} </div>
                <p>₹${product.price ? product.price.toLocaleString('en-IN') : 'N/A'}</p>
                <button class="btn-Cart add-to-cart-btn"
                        data-serial-no="${product.serial_no}"
                        data-unit="${product.unit || 'unit'}"
                        data-name="${product.name}"
                        data-price="${product.price}">
                    Add to Cart
                </button>
            `;
            productContainer.appendChild(productCard);
        });
        attachAddToCartListeners(); // Attach listeners after rendering products
    }

    // Function to sort products
    function sortProducts(sortBy) {
        let sortedProducts = [...allProducts]; // Create a copy to sort

        if (sortBy === 'price-asc') {
            sortedProducts.sort((a, b) => (a.price || 0) - (b.price || 0));
        } else if (sortBy === 'price-desc') {
            sortedProducts.sort((a, b) => (b.price || 0) - (a.price || 0));
        } else if (sortBy === 'name-asc') {
            sortedProducts.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        } else if (sortBy === 'name-desc') {
            sortedProducts.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
        }
        renderProducts(sortedProducts);
    }

    // Function to attach event listeners to 'Add to Cart' buttons
    function attachAddToCartListeners() {
        document.querySelectorAll('.add-to-cart-btn').forEach(button => {
            button.removeEventListener('click', handleAddToCartClick); // Remove old listeners to prevent duplicates
            button.addEventListener('click', handleAddToCartClick);
        });
    }

    function handleAddToCartClick(event) {
        event.preventDefault(); // Prevent default button behavior
        const serialNo = this.dataset.serialNo;
        const initialSize = this.dataset.size || 'N/A'; // Default or retrieve from data if applicable
        const productUnit = this.dataset.unit;
        const productName = this.dataset.name;
        const priceString = this.dataset.price; // Get the string directly
        const ProductPrice = parseFloat(priceString); // Ensure price is a number

        console.log('--- Add to Cart Click Debug ---'); // Debugging log
        console.log('Button Data:', this.dataset); // Debugging log
        console.log('Parsed ProductPrice:', ProductPrice); // Debugging log

        // For product listing, always add 1 quantity when clicking the button
        if (!isNaN(ProductPrice)) { // Ensure price is a valid number
            console.log('Calling addToCart with:', { serialNo, quantity: "1", initialSize, productUnit, productName, ProductPrice }); // Debugging log
            addToCart(serialNo, 1, initialSize, productUnit, productName, ProductPrice);
        } else {
            console.error("Invalid product price for Add to Cart. Received:", priceString);
            alert("Error: Could not add product to cart due to invalid price.");
        }
        console.log('--- End Add to Cart Click Debug ---'); // Debugging log
    }


    // --- Load products from Firebase Firestore ---
    document.addEventListener('DOMContentLoaded', async () => {
        // Display loading message
        productContainer.innerHTML = '<img src="/img/PROC/Loading.gif" alt="Loading Products"><p style="text-align: center; width: 100%; margin-top: 20px;">Loading  products...</p>';

        // Corrected collection path to match your Firebase rules and backend data structure
        const productsCollectionRef = collection(db, "artifacts", FIRESTORE_APP_ID, "products"); 
        
        try {
            const querySnapshot = await getDocs(productsCollectionRef);
            allProducts = []; // Clear previous products if any
            querySnapshot.forEach((doc) => {
                // doc.data() is never undefined for query doc snapshots
                allProducts.push(doc.data());
            });

            // Initial render of all products fetched from Firestore
            renderProducts(allProducts);

            // Add event listener for sorting dropdown
            sortSelect.addEventListener('change', () => {
                sortProducts(sortSelect.value);
                // Add total product count
                const totalProductsElement = document.getElementById('totalProducts');
                if (totalProductsElement) {
                    totalProductsElement.textContent = `Total Products: ${allProducts.length}`;
                    totalProductsElement.style.marginTop = '20px';
                    productContainer.parentElement.appendChild(totalProductsElement);
                }
            });
            // Search functionality for products
                const searchInput = document.getElementById('productSearchInput');
                const searchBtn = document.getElementById('productSearchBtn');

                function filterProductsBySearch(query) {
                    const lowerQuery = query.trim().toLowerCase();
                    if (!lowerQuery) {
                        renderProducts(allProducts);
                        return;
                    }
                    const filtered = allProducts.filter(product => {
                        const name = (product.name || '').toLowerCase();
                        const serial = (product.serial_no || '').toLowerCase();
                        return name.includes(lowerQuery) || serial.includes(lowerQuery);
                    });
                    renderProducts(filtered);
                    // Update total products count
                    const totalProductsElement = document.getElementById('totalProducts');
                    if (totalProductsElement) {
                        totalProductsElement.textContent = `Total Products: ${filtered.length}`;
                    }
                }

                searchBtn.addEventListener('click', () => {
                    filterProductsBySearch(searchInput.value);
                });

                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter') {
                        filterProductsBySearch(searchInput.value);
                    }
                });

            // Add total product count after initial render
            const totalProductsElement = document.getElementById('totalProducts');
            if (totalProductsElement) {
                totalProductsElement.textContent = `Total Products: ${allProducts.length}`;
                totalProductsElement.style.marginTop = '20px';
                productContainer.parentElement.appendChild(totalProductsElement);
            }
        } catch (error) {
            console.error("Error loading product data", error);
            // Display an error message on the page if data loading fails
            const errorMessageElement = document.createElement('p');
            errorMessageElement.textContent = "Failed to load products. Please check your internet connection or try again later.";
            errorMessageElement.style.color = "red";
            errorMessageElement.style.textAlign = "center";
            productContainer.appendChild(errorMessageElement);
        }
    });
</script>
</body>
</html>
