        const iferror = document.getElementById('display-error')
        const loading = document.getElementById('loading')

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function smalldelay () {
            await sleep(3679);
            iferror.classList.remove('hidden');
            loading.classList.add('hidden')
        }
        function troll() {

            trollvideoloc.innerHTML= `<video width="320" height="240" autoplay><source src="vid/TROL/rickroll.mp4" type="video/mp4"></video>`
        }
        smalldelay()
        

        Retrybutton.onclick = () => troll()
