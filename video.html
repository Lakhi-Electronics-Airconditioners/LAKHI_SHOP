    <!-- Firebase SDKs -->
    <script>

        document.getElementById("year-input").value = currentYear;

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
            authDomain: "lakhi-airconditioners.firebaseapp.com",
            projectId: "lakhi-airconditioners",
            storageBucket: "lakhi-airconditioners.firebasestorage.app",
            messagingSenderId: "284430318185",
            appId: "1:284430318185:web:ad09598be7a16ab46a00f8",
            measurementId: "G-LB63B1FRYC"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const FIRESTORE_APP_ID = "lakhi-airconditioners";

        // Function to fetch and display video links for a given year
        async function fetchVideosByYear(year) {
            const videoList = document.getElementById('video-list');
            const titleElement = document.getElementById('video-collection-title');
            videoList.innerHTML = '<li>Loading videos...</li>';
            titleElement.textContent = `${year} Video Collection`;

            try {
                const linksCollectionRef = collection(db, "artifacts", FIRESTORE_APP_ID, "video", year, "links"); 
                const querySnapshot = await getDocs(linksCollectionRef);
                
                videoList.innerHTML = ''; // Clear previous list

                if (querySnapshot.empty) {
                    console.log("No documents found for this year!");
                    videoList.innerHTML = '<li>No videos found for this year.</li>';
                } else {
                    const videos = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.name && data.vid_id) {
                            videos.push(data);
                        }
                    });

                    // Sort videos by vid_id in descending order
                    videos.sort((a, b) => b.vid_id.localeCompare(a.vid_id));

                    videos.forEach((videoData) => {
                        const listItem = document.createElement('li');
                        const link = document.createElement('a');
                        link.href = `video/ex_or_in?vid_id=${videoData.vid_id}&year=${year}`;
                        link.textContent = videoData.name;
                        link.style.color = '#000000'; // Set link color to black
                        listItem.appendChild(link);
                        videoList.appendChild(listItem);
                    });
                }
            } catch (error) {
                console.error("Error getting documents:", error);
                videoList.innerHTML = '<li>Error loading videos.</li>';
            }
        }
        
        // Initial load with the default year
        const initialYear = document.getElementById('year-input').value;
        fetchVideosByYear(initialYear);

        // Function to handle year change
        window.changeYear = function() {
            const year = document.getElementById('year-input').value;
            if (year) {
                fetchVideosByYear(year);
            }
        };

        // Update the copyright year
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
