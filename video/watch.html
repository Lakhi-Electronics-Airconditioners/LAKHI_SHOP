<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakhi Airconditioners | Watch Video</title>
    <meta name="description" content="watch video (will not without vidid in url)">
    <link rel="icon" href="../img/1x1-logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="../DOWNLOADED CSS/fontawesome-free-6.7.2-web/css/all.min.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch(err => console.error('❌ Service Worker error:', err));
        }
    </script>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            margin-top: 20px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .main-content {
            padding: 20px;
        }
        
        .loading-text {
            text-align: center;
            font-size: 1.2em;
            color: #555;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div id="tacpp-el"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/tacpp.js" defer></script>
    <script src="https://shop.lakhiairconditioners.com/js/TACPP.js" defer></script>
    

    <div class="header-NAV" id="header"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/header.js" defer></script>

    <div class="color-NAV"><br><br><a href="#" class="back-button" onclick="history.back(); return false;">&larr; Back</a></div>
    <div class="container main-content">
        <h1 class="title2">Watch Video</h1>
        <p id="loading-message" class="loading-text">Loading video...</p>
        <div id="video-embed-container" class="video-container">
            <!-- Video embed will be loaded here by JavaScript -->
        </div>
    </div>

   <div id="footer" class="footer"></div>
    <script src="https://shop.lakhiairconditioners.com/js/rw/footer.js" defer></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // Firebase config is provided by the canvas environment
       const firebaseConfig = {
            apiKey: "AIzaSyC-16u2n4IaGRmg88nsPmMYCGKp2jjL9Bg",
            authDomain: "lakhi-airconditioners.firebaseapp.com",
            projectId: "lakhi-airconditioners",
            storageBucket: "lakhi-airconditioners.firebasestorage.app",
            messagingSenderId: "284430318185",
            appId: "1:284430318185:web:ad09598be7a16ab46a00f8",
            measurementId: "G-LB63B1FRYC"
          };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // App ID is also provided by the canvas environment
        const appId = 'lakhi-airconditioners';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vidId = urlParams.get('vid_id');
            const year = urlParams.get('year');
            const platform = urlParams.get('platform');
            const videoEmbedContainer = document.getElementById('video-embed-container');
            const loadingMessage = document.getElementById('loading-message');

            if (!vidId || !year) {
                loadingMessage.textContent = 'Error: Video ID or Year not provided.';
                return;
            }

            try {
                if (platform) {
                    // If platform is provided, try to redirect
                    try {
                        const linkDocRef = doc(db, "artifacts", appId, "video", year, "links", vidId);
                        const linkDocSnap = await getDoc(linkDocRef);
                        if (linkDocSnap.exists() && linkDocSnap.data()[platform]) {
                            window.location.href = linkDocSnap.data()[platform];
                            return; // Stop further execution
                        } else {
                            // Fallback to embed if platform link not found
                            loadingMessage.textContent = `Link for platform '${platform}' not found. Trying to load embed...`;
                        }
                    } catch (linkError) {
                        console.error("Error fetching platform link:", linkError);
                        loadingMessage.textContent = 'Error fetching platform link. Trying to load embed...';
                    }
                }

                // Load embed code if platform is not specified or link is not found
                const embedDocRef = doc(db, "artifacts", appId, "video", year, "embed", vidId);
                const docSnap = await getDoc(embedDocRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.code) {
                        videoEmbedContainer.innerHTML = data.code;
                        loadingMessage.style.display = 'none'; // Hide loading message
                    } else {
                        loadingMessage.textContent = 'Embed code not found for this video.';
                    }
                } else {
                    loadingMessage.textContent = 'Video not found in the database.';
                }
            } catch (error) {
                console.error("Error fetching video embed code:", error);
                loadingMessage.textContent = 'Error loading video. Please check your Firestore rules.';
            }
        });
    </script>
    
</body>
</html>
